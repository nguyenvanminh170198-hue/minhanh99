<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>MinhAnh99</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
    }
    .container {
      padding: 60px 20px;
    }
    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 4px solid #fff;
      object-fit: cover;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    p {
      font-size: 18px;
      opacity: 0.9;
    }
    .buttons {
      margin-top: 30px;
    }
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 14px 28px;
      background: white;
      color: #764ba2;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      transform: scale(1.05);
      background: #f1f1f1;
    }
    footer {
      margin-top: 60px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="avatar.jpg" alt="Ảnh đại diện">

    <h1>Chào mừng đến với MinhAnh99</h1>
    <p>Website cá nhân – đang phát triển 🚀</p>

    <div class="buttons">
      <a class="btn" href="https://zalo.me/0123456789" target="_blank">📱 Liên hệ Zalo</a>
      <a class="btn" href="https://facebook.com/" target="_blank">📘 Facebook</a>
      <a class="btn" href="mailto:email@gmail.com">✉️ Email</a>
    </div>
  </div>

  <footer>
    © 2026 MinhAnh99.com
  </footer>

</body>
</html>
